name: Optional package architecture policy

on:
  pull_request:
  push:
    branches: [main]

permissions: {contents: read}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: python3 tools/validate-architecture-policy.py
